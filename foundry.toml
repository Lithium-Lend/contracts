[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
skip = ["*Governance/Governor*"]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "compound/=lib/compound-protocol/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
litvm_liteforge = "https://liteforge.rpc.caldera.xyz/http"
