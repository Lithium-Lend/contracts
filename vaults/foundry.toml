[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["../lib"]
solc_version = "0.8.38"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
build_info = true
remappings = ["@openzeppelin/=../lib/openzeppelin-contracts/contracts/", "forge-std/=../lib/forge-std/src/"]

[fmt]
line_length = 120
