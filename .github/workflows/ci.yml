name: Contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  token:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize token dependencies
        run: git submodule update --init --recursive -- lib/forge-std lib/openzeppelin-contracts
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.0
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  comet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: comet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize Comet dependencies
        working-directory: .
        run: >-
          git -c url."https://github.com/".insteadOf=git@github.com:
          submodule update --init --recursive --
          lib/comet lib/forge-std lib/openzeppelin-contracts
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.0
      - name: Verify Comet dependency pin
        working-directory: .
        run: test "$(git -C lib/comet rev-parse HEAD)" = "f766f51583c23acc33b2a7824654ef2029a96804"
      - name: Build cross-compiler test asset
        working-directory: .
        run: forge build src/testnet/LithiumUSDC.sol src/testnet/LithiumUSDT.sol
      - run: forge lint --color never
      - run: forge fmt --check
      - run: forge build --sizes --skip test --skip script
      - run: node script/verify-liteforge.mjs --check
      - run: node script/check-market-boundaries.mjs
      - run: node script/check-cap-upgrades.mjs
      - name: Reproduce cap upgrade compiler input
        run: node script/prepare-cap-upgrade-build.mjs "$HOME/.svm/0.8.15/solc-0.8.15" "$RUNNER_TEMP/lithium-cap-build"
      - run: node research/rate-simulation.mjs
      - run: node research/additional-market-simulation.mjs --check
      - name: Check additional market compiler inputs
        run: |
          node script/verify-additional.mjs usdt --check
          node script/verify-additional.mjs zkltc --check
          node script/verify-additional.mjs token --check
      - run: forge test -vvv
      - run: node ../script/check-abis.mjs
      - name: Verify upstream files are unchanged
        working-directory: .
        run: test -z "$(git -C lib/comet status --porcelain)"

  validate:
    if: always()
    needs: [token, comet]
    runs-on: ubuntu-24.04
    steps:
      - name: Require contract jobs
        env:
          TOKEN_RESULT: ${{ needs.token.result }}
          COMET_RESULT: ${{ needs.comet.result }}
        run: test "$TOKEN_RESULT" = success && test "$COMET_RESULT" = success
