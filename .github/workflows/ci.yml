name: Contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  token:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize token dependencies
        run: git submodule update --init --recursive -- lib/forge-std lib/openzeppelin-contracts
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.0
      - run: forge fmt --check
      - run: forge build --sizes
      # Deployment tests mutate the same process environment variables.
      - run: forge test -vvv --threads 1

  comet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: comet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize Comet dependencies
        working-directory: .
        run: >-
          git -c url."https://github.com/".insteadOf=git@github.com:
          submodule update --init --recursive --
          lib/comet lib/forge-std lib/openzeppelin-contracts
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.0
      - name: Verify Comet dependency pin
        working-directory: .
        run: test "$(git -C lib/comet rev-parse HEAD)" = "f766f51583c23acc33b2a7824654ef2029a96804"
      - name: Build cross-compiler test asset
        working-directory: .
        run: forge build src/testnet/LithiumUSDC.sol src/testnet/LithiumUSDT.sol
      - run: forge lint --color never
      - run: forge fmt --check
      - run: forge build --sizes --skip test --skip script
      - run: node script/verify-liteforge.mjs --check
      - run: node script/check-market-boundaries.mjs
      - name: Test deployment attestation controls
        working-directory: .
        run: node --test script/test-attestation.mjs script/test-explorer.mjs script/test-slither-review.mjs
      - run: node script/check-cap-upgrades.mjs
      - run: node script/verify-current.mjs --check
      - name: Reproduce cap upgrade compiler input
        run: node script/prepare-cap-upgrade-build.mjs "$HOME/.svm/0.8.15/solc-0.8.15" "$RUNNER_TEMP/lithium-cap-build"
      - name: Reproduce smaller explorer verification inputs
        run: node script/check-current-verification.mjs "$HOME/.svm/0.8.15/solc-0.8.15" "$RUNNER_TEMP/lithium-cap-build"
      - run: node research/rate-simulation.mjs
      - run: node research/additional-market-simulation.mjs --check
      - name: Check additional market compiler inputs
        run: |
          node script/verify-additional.mjs usdt --check
          node script/verify-additional.mjs zkltc --check
          node script/verify-additional.mjs token --check
      - run: forge test -vvv
      - run: node ../script/check-abis.mjs
      - name: Verify upstream files are unchanged
        working-directory: .
        run: test -z "$(git -C lib/comet status --porcelain)"

  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [token, comet]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.11.1'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.0'
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.0
      - name: Initialize dependencies
        run: >-
          git -c url."https://github.com/".insteadOf=git@github.com:
          submodule update --init --recursive --
          lib/comet lib/forge-std lib/openzeppelin-contracts
      - name: Install pinned independent analyzer
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r security/requirements.txt
      - name: Analyze production contracts
        env:
          ANALYSIS_PROJECT: ${{ matrix.project }}
        run: node script/run-slither.mjs "$ANALYSIS_PROJECT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: analysis-${{ matrix.project }}
          path: |
            attestation/slither-*.json
            attestation/slither-*.log
          retention-days: 30
          if-no-files-found: error

  deployment:
    uses: ./.github/workflows/deployment.yml

  validate:
    if: always()
    needs: [token, comet, analysis, deployment]
    runs-on: ubuntu-24.04
    steps:
      - name: Require contract jobs
        env:
          TOKEN_RESULT: ${{ needs.token.result }}
          COMET_RESULT: ${{ needs.comet.result }}
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
        run: test "$TOKEN_RESULT" = success && test "$COMET_RESULT" = success && test "$ANALYSIS_RESULT" = success && test "$DEPLOYMENT_RESULT" = success
