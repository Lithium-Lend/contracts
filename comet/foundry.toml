[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../lib"]
solc_version = "0.8.15"
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read", path = "./config" },
  { access = "read", path = "./deployments/liteforge-lith-usdc.json" },
  { access = "read", path = "../out/LithiumUSDC.sol/LithiumUSDC.json" },
]
remappings = ["comet/=../lib/comet/contracts/", "forge-std/=../lib/forge-std/src/"]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

[fmt]
line_length = 120

[rpc_endpoints]
litvm_liteforge = "https://liteforge.rpc.caldera.xyz/http"

# The RPC-side deployment simulation must execute newer token/feed opcodes.
# Compile every artifact with the original London settings, independently.
[profile.liteforge]
evm_version = "prague"
out = "out-liteforge"
cache_path = "cache-liteforge"
additional_compiler_profiles = [{ name = "london", evm_version = "london" }]
compilation_restrictions = [{ paths = "**", evm_version = "london" }]
